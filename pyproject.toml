[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyveiga"
version = "0.1.0"
description = "Bot auto-hospedado de dailys para Discord"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4,<3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[project.scripts]
dailyveiga = "dailyveiga.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
